<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content = "width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>

    <header>
        <img src="assets/smartcontrollogo.png" alt="logo do sistema" width="100">
    </header>

    <form>
        <h2>Cadastro de Usuário</h2>

        <label for="Nome Completo">Nome</label>
        <br>
        <input type="text" id="nome" required>
        <br><br>

        <label for="E-mail Corporativo">Nome</label>
        <br>
        <input type="text" id="email" required>
        <br><br>

        <label for="Senha">Nome</label>
        <br>
        <input type="text" id="senha" minlength="8" required>
        <br><br>

        <label for="Nível de acesso">Nome</label required>
        <br>
        <input type="text" id="Nível">
        <br><br>

        <input type="checkbox" id="termos" required>
        <label for="termos">Aceito os termos de uso</label>
        <br><br>

        <button type="Cadastrar">Cadastrar</button>
        <br><br>

        <a href="login.html">Voltar para o Login </a>

    </form>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content = "width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>

    <header>
        <img src="assets/smartcontrollogo.png" alt="logo do sistema">
    </header>
    
    <aside>
        <nav>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Estoque</a></li>
                <li><a href="#">Receitas</a></li>
                <li><a href="#">Despesas</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <h1>Dashboard</h1>
        <h2>Relatório de acessos recentes</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Cristiano Ronaldo</td>
                    <td>28/07/2026</td>
                    <td>08:15</td>
                    <td>Online</td>
                </tr>

                <tr>
                    <td>Lionel Messi</td>
                    <td>27/07/2026</td>
                    <td>10:25</td>
                    <td>Online</td>
                </tr>

                <tr>
                    <td>Pedro Lucas</td>
                    <td>15/07/2026</td>
                    <td>09:30</td>
                    <td>Online</td>
                </tr>

                <tr>
                    <td>Neymar Jr</td>
                    <td>23/07/2026</td>
                    <td>23:15</td>
                    <td>Offline</td>
                </tr>


            </tbody>
        </table>
    </main>

    <footer>
        <h2>Localização da sede</h2>

        <iframe
            src="https://maps.app.goo.gl/YZ8mLNCxpHvRieEy7"
            width="600"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
        </iframe>
        
    </footer>
</body>
</html>
